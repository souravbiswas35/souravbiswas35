<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%">
  <defs>
    <!-- Body scale gradient: deep emerald to golden-lime highlight, dark theme friendly -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#0d3b2e"/>
      <stop offset="35%" stop-color="#127a52"/>
      <stop offset="55%" stop-color="#28a768"/>
      <stop offset="75%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#0a2e22"/>
    </linearGradient>

    <radialGradient id="scaleShine" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#c8ffb0" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#39c06a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="60%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#7a4b00"/>
    </radialGradient>

    <pattern id="scalePattern" width="18" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0,14 Q9,0 18,14" fill="none" stroke="#04140f" stroke-opacity="0.35" stroke-width="1.2"/>
    </pattern>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background track (subtle, transparent-friendly) -->
  <rect x="0" y="0" width="900" height="220" fill="transparent"/>

  <!-- ============ SNAKE BODY ============ -->
  <g filter="url(#softShadow)">
    <path id="spine"
          d="M -50,110
             C 30,40  90,180  170,110
             C 250,40 310,180 390,110
             C 470,40 530,180 610,110
             C 690,40 750,180 830,110
             C 870,80 900,90 950,110"
          fill="none"
          stroke="url(#scaleGrad)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-dasharray="1400"
          stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset"
                from="0" to="-1400"
                dur="3.2s"
                repeatCount="indefinite"/>
    </path>

    <!-- scale texture overlay, follows same path -->
    <path d="M -50,110
             C 30,40  90,180  170,110
             C 250,40 310,180 390,110
             C 470,40 530,180 610,110
             C 690,40 750,180 830,110
             C 870,80 900,90 950,110"
          fill="none"
          stroke="url(#scalePattern)"
          stroke-width="34"
          stroke-linecap="round"
          opacity="0.5"
          stroke-dasharray="1400"
          stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset"
                from="0" to="-1400"
                dur="3.2s"
                repeatCount="indefinite"/>
    </path>

    <!-- top-light shine, follows same path -->
    <path d="M -50,110
             C 30,40  90,180  170,110
             C 250,40 310,180 390,110
             C 470,40 530,180 610,110
             C 690,40 750,180 830,110
             C 870,80 900,90 950,110"
          fill="none"
          stroke="url(#scaleShine)"
          stroke-width="14"
          stroke-linecap="round"
          stroke-dasharray="1400"
          stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset"
                from="0" to="-1400"
                dur="3.2s"
                repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ HEAD (rides along the same path) ============ -->
  <g>
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#spine"/>
    </animateMotion>

    <!-- head shape -->
    <ellipse cx="0" cy="0" rx="26" ry="19" fill="url(#scaleGrad)" filter="url(#softShadow)"/>
    <ellipse cx="6" cy="0" rx="16" ry="12" fill="url(#scaleShine)"/>

    <!-- eyes -->
    <circle cx="10" cy="-8" r="4.2" fill="url(#eyeGlow)"/>
    <circle cx="10" cy="8"  r="4.2" fill="url(#eyeGlow)"/>
    <circle cx="11.5" cy="-8" r="1.6" fill="#000"/>
    <circle cx="11.5" cy="8"  r="1.6" fill="#000"/>

    <!-- flicking forked tongue -->
    <g>
      <path d="M 24,0 L 42,0" stroke="#ff2e63" stroke-width="2" stroke-linecap="round">
        <animate attributeName="d"
                 values="M 24,0 L 42,0; M 24,0 L 46,-2; M 24,0 L 42,0"
                 dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 42,0 L 48,-4" stroke="#ff2e63" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 42,0 L 48,4" stroke="#ff2e63" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
