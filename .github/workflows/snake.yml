name: Generate Snake

on:
  schedule:
    - cron: "* */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: souravbiswas35
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff00ff&color_dots=#ebedf0,#8c96c6,#8856a7,#810f7c,#4d004b
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff00ff&color_dots=#161b22,#0e75b6,#00a884,#28a768,#37F706&color_bg=#0d1117
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
