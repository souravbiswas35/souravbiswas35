name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: souravbiswas35
          outputs: |
            dist/snake-neon-dark.svg?color_snake=#ff2e88&color_dots=#161b22,#3c096c,#7209b7,#c77dff,#4cc9f0&color_background=#0d1117
            dist/snake-neon-light.svg?color_snake=#7209b7&color_dots=#ebedf0,#c77dff,#9d4edd,#5a189a,#3c096c
            dist/snake.gif?color_snake=#f72585&color_dots=#0d1117,#3a0ca3,#7209b7,#f72585,#4cc9f0&color_background=#0d1117
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
